<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 768" role="img" aria-labelledby="title">
  <title id="title">Generic resident card reverse placeholder</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a3d"/>
      <stop offset="1" stop-color="#164b82"/>
    </linearGradient>
  </defs>
  <rect width="1360" height="768" rx="48" fill="url(#background)"/>
  <rect x="24" y="24" width="1312" height="720" rx="36" fill="none" stroke="#54c8ec" stroke-opacity=".65" stroke-width="4"/>
  <text x="80" y="130" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">LOCAL GOVERNMENT</text>
  <text x="80" y="220" fill="#dbeafe" font-family="Arial, sans-serif" font-size="28">OFFICE ADDRESS</text>
  <text x="80" y="280" fill="#dbeafe" font-family="Arial, sans-serif" font-size="28">CONTACT NUMBER</text>
  <text x="80" y="340" fill="#dbeafe" font-family="Arial, sans-serif" font-size="28">OFFICIAL EMAIL</text>
  <rect x="80" y="398" width="1200" height="94" rx="12" fill="#fff"/>
  <text x="112" y="458" fill="#102a4c" font-family="monospace" font-size="32">IDENTIFICATION NUMBER</text>
  <text x="80" y="588" fill="#aee8f8" font-family="Arial, sans-serif" font-size="24">TEMPLATE PREVIEW - NOT AN OFFICIAL IDENTIFICATION CARD</text>
</svg>
